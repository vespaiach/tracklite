# Read by shipit (https://github.com/vespaiach/shipit): sourced by bash as deployer during a deploy and
# as the tracklite user by its launcher, with PORT already set. Root only greps the PROCESS_ and
# HEALTH_PATH lines, so keep those unindented and literal. ops/deploy.sh ignores this file.
INSTALL="npm ci --no-audit --no-fund"
BUILD="npm run build"
MIGRATE="npm run db:migrate"
HEALTH_PATH=/health
PROCESS_web="next start --hostname 127.0.0.1 --port $PORT"
PROCESS_worker="tsx --conditions=react-server scripts/worker.ts"
